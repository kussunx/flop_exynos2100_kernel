name: Exynos2100 video stutter test2 (BakaSU + SUSFS)

on:
  push:
    branches:
      - fix/video-stutter-sbwcl-test2
  workflow_dispatch:

concurrency:
  group: video-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bakasu_susfs:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Init required mkbootimg submodule
        run: git submodule update --init --depth=1 build/mkbootimg

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            aria2 brotli zip zstd tar lz4 cpio xz-utils flex bc kmod \
            ccache binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu

      - name: Build and package BakaSU + SUSFS AnyKernel3 ZIP
        env:
          DO_TAR: "0"
          USE_CCACHE: "0"
          KERNEL_URL: "https://github.com/kussunx/flop_exynos2100_kernel"
          FK_VER: "v1.1.2-kussun-test2"
        run: |
          set -euo pipefail
          # Internal legacy "s" flag selects BakaSU from drivers/sukisu.
          grep -Fqx 'static int default_sbwc_mode = FK_SBWC_MODE_NO_SBWC;' init/main.c
          grep -Fqx 'static char default_sbwc_mode_default_arg[] = "default_sbwc_mode=1";' init/main.c
          bash ./do_build.sh sq
          grep -qx 'CONFIG_KSU_SUKI=y' out/.config
          grep -qx 'CONFIG_KSU=y' out/.config
          grep -qx 'CONFIG_KSU_SUSFS=y' out/.config
          grep -qx 'CONFIG_KSU_MANUAL_HOOK=y' out/.config
          grep -qx '# CONFIG_KSU_MULTI_MANAGER_SUPPORT is not set' out/.config
          if grep -Eq '^CONFIG_KSU_(NEXT|XXKSU)=y$' out/.config; then
            echo "Unexpected alternate root variant enabled" >&2
            exit 1
          fi
          zipfile="$(find build -maxdepth 1 -name 'Floppy_*BakaSU-SUSFS*.zip' -print -quit)"
          test -n "$zipfile"
          unzip -t "$zipfile"
          entries="$(unzip -Z1 "$zipfile")"
          for required in Image vendor_boot.img anykernel.sh dtbo_o1s.img dtbo_r9s.img dtbo_p3s.img dtbo_t2s.img; do
            if ! grep -Fxq "$required" <<< "$entries"; then
              echo "Missing required flashable ZIP entry: $required" >&2
              exit 1
            fi
          done
          sha256sum "$zipfile" | tee build/SHA256SUMS.txt

      - name: Upload installable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Floppy-VideoStutter-TEST2-BakaSU-SUSFS
          path: |
            build/Floppy_*BakaSU-SUSFS*.zip
            build/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
