name: Video flicker experimental kernel (Vanilla)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vanilla:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            aria2 brotli zip zstd tar lz4 cpio xz-utils flex bc kmod \
            ccache binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu

      - name: Build and package Vanilla AnyKernel3 ZIP
        env:
          DO_TAR: "0"
          USE_CCACHE: "0"
          KERNEL_URL: "https://github.com/kussunx/flop_exynos2100_kernel"
        run: |
          set -euo pipefail
          bash ./do_build.sh q
          ls -lh build/Floppy_*.zip
          unzip -t build/Floppy_*.zip

      - name: Upload installable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Floppy-VideoFlicker-TEST-Vanilla
          path: build/Floppy_*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
